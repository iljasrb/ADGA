<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{% if page and page.description %}{{ page.description }}{% elif section and section.description %}{{ section.description }}{% else %}{{ config.description }}{% endif %}">
<link rel="canonical" href="{{ config.base_url }}{{ current_path }}">
<title>{% block title %}{{ config.title }}{% endblock %}</title>
<link rel="alternate" type="application/rss+xml" title="{{ config.title }}" href="{{ get_url(path='rss.xml') }}">
<link rel="stylesheet" href="{{ get_url(path='style.css') }}">
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<div class="wrapper">

<header>
    <div class="bar">
        <a class="brand" href="{{ config.base_url }}/">devices.flac.moe</a>
        <nav class="site" aria-label="Site">
            <a href="{{ config.base_url }}/about/"{% if current_path | split(pat="/") | nth(n=1) == "about" %} aria-current="page"{% endif %}>About</a>
        </nav>
        <div class="actions">
            <button class="search-open" id="search-open" type="button" aria-haspopup="dialog" aria-keyshortcuts="Control+K">
                <span>Search</span><kbd id="search-key">Ctrl K</kbd>
            </button>
            <a class="icon" href="{{ config.extra.repo_url }}" rel="noopener" aria-label="GitHub" title="GitHub">
                <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
            </a>
        </div>
    </div>
</header>

<main id="content">
{% block body %}{% endblock %}
</main>

<footer>
    <p><a href="{{ config.extra.repo_url }}/blob/main/CONTRIBUTING.md">Contributing</a> ·
        <a href="{{ config.extra.repo_url }}">Source</a> ·
        <a href="{{ get_url(path='rss.xml') }}">RSS</a></p>
    <p>Content <a href="https://creativecommons.org/licenses/by-sa/4.0/" rel="noopener">CC BY-SA 4.0</a>, site code MIT · built with <a href="https://www.getzola.org/" rel="noopener">Zola</a>.</p>
</footer>

</div>

<dialog class="search-dialog" id="search-dialog" aria-labelledby="search-title">
    <div class="search-head">
        <h2 class="visually-hidden" id="search-title">Search guides</h2>
        <label class="visually-hidden" for="search-input">Search guides</label>
        <input id="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="Search guides…" aria-controls="search-results">
        <button class="search-close" id="search-close" type="button" aria-label="Close search">✕</button>
    </div>
    <p class="visually-hidden" id="search-status" role="status"></p>
    <ul class="search-results" id="search-results" aria-label="Results"></ul>
    <p class="search-hint" id="search-hint">↑↓ move · ↵ open · esc close</p>
</dialog>

<template id="search-result">
    <li><a href=""><span class="crumb"></span><span class="title"></span><span class="snippet"></span></a></li>
</template>

<script type="module" src="{{ get_url(path='search.js') }}"></script>
<script src="{{ get_url(path='copy-code.js') }}" defer></script>
</body>
</html>
