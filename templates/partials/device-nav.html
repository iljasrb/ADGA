<nav class="side" aria-label="{{ device.title }} guides">
    <a class="root" href="{{ device.permalink }}"{% if current == device.path %} aria-current="page"{% endif %}>{{ device.title }}</a>
    <ul>
        {% for page in device.pages %}
        <li><a href="{{ page.permalink }}"{% if current == page.path %} aria-current="page"{% endif %}>{{ page.title }}</a></li>
        {% endfor %}
    </ul>
    <a class="ext" href="{{ flasher }}" rel="noopener">Web flasher ↗</a>
</nav>
